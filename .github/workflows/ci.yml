name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib tool test
      - run: flutter analyze
      - run: tool/check_layers.sh
      - run: node tool/check_arabic.mjs
      - run: flutter test
      # Placeholder addresses: CI only checks that the web build compiles. Real builds take the project's addresses.
      - run: flutter build web --release --wasm --dart-define=NEON_AUTH_URL=https://placeholder.neonauth.eu-central-1.aws.neon.tech/neondb/auth --dart-define=NEON_DATA_API_URL=https://placeholder.apirest.eu-central-1.aws.neon.tech/neondb/rest/v1

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: tool/check_sql.sh
